<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Applications</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
.container{max-width:900px;margin:50px auto;padding:0 20px}
h1{margin:0 0 8px;font-size:30px}.subtitle{color:#666;margin:0 0 28px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.app{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:10px;padding:22px;box-shadow:0 2px 7px rgba(0,0,0,.08);transition:.12s}
.app:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(0,0,0,.12)}
.icon{font-size:30px;margin-bottom:12px}.name{font-size:19px;font-weight:bold;margin-bottom:7px}
.description{color:#666;font-size:14px;line-height:1.4}
.instructions{margin-top:28px;padding:15px 18px;background:#fff;border-left:4px solid #2563eb;border-radius:6px;color:#555;font-size:14px}
code{background:#eee;padding:2px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="container">
<h1>My Applications</h1>
<p class="subtitle">Choose an application to open</p>
<div class="apps">
<a class="app" href="customer-requests.html"><div class="icon">📋</div><div class="name">Manal Hafez</div><div class="description">Manage customer requests, notes and request status.</div></a>
<a class="app" href="JamesSmith.html"><div class="icon">📋</div><div class="name">James Smith</div><div class="description">Open James Page.</div></a>
<a class="app" href="michaelturvey.html"><div class="icon">📋</div><div class="name">Michael Turvey</div><div class="description">Open Michael Page.</div></a>
</body>
</html>
